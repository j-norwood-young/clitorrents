name: Update Homebrew formula

# Called by release.yml once the GitHub release exists. (An `on: release` trigger never
# fires there, as releases created with GITHUB_TOKEN don't trigger other workflows.)
# Can also be run by hand to re-bump the tap for an existing release.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (e.g. v0.5.2)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.5.2)
        required: true

jobs:
  bump-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Check out homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: j-norwood-young/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Bump clitorrents formula
        working-directory: homebrew-tap
        env:
          TAG: ${{ inputs.tag }}
        run: ./scripts/bump-clitorrents.sh "$TAG"

      - name: Commit formula update
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: homebrew-tap
          commit_message: "chore(clitorrents): bump to ${{ inputs.tag }}"
          file_pattern: Formula/clitorrents.rb
